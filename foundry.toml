[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
test = "formal-verification"

# Fuzzing settings
fuzz_runs = 256
max_test_rejects = 65536

# Gas optimization
optimizer = true
optimizer_runs = 200

# Visibility
verbosity = 3

# Dependencies
solc_version = "0.8.24"
auto_detect_solc = false
